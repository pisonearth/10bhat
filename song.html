<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Song for You 🎵</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;

      background: #c99b6b;
      font-family: "Montserrat", sans-serif;
      color: #4a3428;
    }

    .music-card {
      width: min(500px, 100%);
      padding: 40px 30px;
      background: #fffdf5;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .music-card h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .music-card p {
      margin: 0 0 30px;
      line-height: 1.7;
      font-size: 15px;
    }

    audio {
      width: 100%;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #70452f;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="music-card">

    <h1>🎵 A Little Song for You</h1>

    <p>
      A little something I made for you as my birthday gift. 🤍
    </p>

    <audio controls preload="auto">
      <source src="audio/newchapter.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <a href="greetings.html" class="back">
      ← Back to the birthday board
    </a>

  </div>

</body>

</html>
